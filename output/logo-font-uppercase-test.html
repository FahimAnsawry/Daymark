<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Daymark uppercase logo fonts</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@112..125,500..800&family=Bricolage+Grotesque:wght@500..800&family=Cinzel:wght@500..800&family=DM+Sans:wght@400..700&family=Josefin+Sans:wght@500..700&family=Lexend:wght@500..700&family=Outfit:wght@500..800&family=Sora:wght@500..800&family=Space+Grotesk:wght@400..700&family=Syne:wght@600..800&family=Unbounded:wght@500..800&family=Urbanist:wght@600..800&display=swap"
    rel="stylesheet"
  />
  <style>
    :root {
      --bg: #f7f6f2;
      --card: #ffffff;
      --text: #1f2937;
      --muted: #5b6b62;
      --line: #e6e9e3;
      --ray: #ea580c;
      --footer: #183b37;
      --accent: #ea580c;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme='light']) {
        --bg: #171717;
        --card: #262626;
        --text: #f3f4f6;
        --muted: #a7b0bf;
        --line: #383838;
        --ray: #fb923c;
        --footer: #111a17;
        --accent: #fb923c;
      }
    }
    :root[data-theme='dark'] {
      --bg: #171717;
      --card: #262626;
      --text: #f3f4f6;
      --muted: #a7b0bf;
      --line: #383838;
      --ray: #fb923c;
      --footer: #111a17;
      --accent: #fb923c;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 32px 16px 64px;
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', ui-sans-serif, system-ui, sans-serif;
      transition: background 0.25s, color 0.25s;
    }
    main { max-width: 1040px; margin: 0 auto; }
    header.page { display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap; }
    h1 { font-family: 'Space Grotesk', sans-serif; font-size: 1.5rem; margin: 0; letter-spacing: -0.02em; }
    .intro { color: var(--muted); font-size: 0.9rem; margin: 8px 0 0; max-width: 60ch; }
    .controls { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; font-size: 0.85rem; color: var(--muted); }
    button {
      font: inherit; font-size: 0.85rem; padding: 8px 14px; border-radius: 999px;
      border: 1px solid var(--line); background: var(--card); color: var(--text); cursor: pointer;
    }
    input[type='range'] { accent-color: var(--accent); width: 120px; }

    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; margin-top: 28px; }
    .card {
      background: var(--card); border: 1px solid var(--line); border-radius: 16px;
      overflow: hidden; display: flex; flex-direction: column;
    }
    .card.pick { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
    .card .body { padding: 26px 22px 18px; display: grid; gap: 14px; flex: 1; }
    .meta { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
    .name { font-weight: 700; font-size: 0.9rem; }
    .tag { font-size: 0.68rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; color: var(--accent); }
    .desc { font-size: 0.8rem; color: var(--muted); margin: 0; line-height: 1.5; }
    .spec { font-size: 0.72rem; color: var(--muted); font-family: ui-monospace, monospace; }
    .strip { background: var(--footer); color: #f7f6f2; padding: 16px 22px; }
    .strip .ray { stroke: #fb923c; }

    /* Wordmark lockup */
    .brand {
      display: inline-flex; align-items: center; gap: 10px; color: inherit;
      text-transform: uppercase; line-height: 1; font-size: calc(var(--s, 1) * var(--size, 1rem));
    }
    .brand svg { display: block; flex-shrink: 0; overflow: visible; }
    .card:hover .sun-lift { transform: translateY(-6%); }

    /* Sunrise mark (mirrors BrandMark.tsx, size md) */
    .sun { fill: #fb923c; transform-box: fill-box; animation: sun-rise 0.9s cubic-bezier(0.16, 1, 0.3, 1) both; }
    .sun-lift { transform-box: fill-box; transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1); }
    .ray { stroke: var(--ray); transform-box: fill-box; transform-origin: center; animation: ray-in 0.35s ease-out both; }
    @keyframes sun-rise { from { transform: translateY(100%); } to { transform: translateY(0); } }
    @keyframes ray-in { from { opacity: 0; transform: scale(0.4); } to { opacity: 1; transform: scale(1); } }
    @media (prefers-reduced-motion: reduce) {
      .sun, .ray { animation: none; }
      .sun-lift { transition: none; }
    }
  </style>
</head>
<body>
  <template id="mark">
    <svg width="44" height="20" viewBox="0 7 104 47" fill="none" aria-hidden="true">
      <defs><clipPath><rect x="0" y="0" width="104" height="50" /></clipPath></defs>
      <g class="clip"><g class="sun-lift"><circle class="sun" cx="52" cy="50" r="24" /></g></g>
      <line class="ray" x1="25.15" y1="34.5" x2="18.23" y2="30.5" stroke-width="6" stroke-linecap="round" />
      <line class="ray" x1="36.5" y1="23.15" x2="32.5" y2="16.23" stroke-width="6" stroke-linecap="round" />
      <line class="ray" x1="52" y1="19" x2="52" y2="11" stroke-width="6" stroke-linecap="round" />
      <line class="ray" x1="67.5" y1="23.15" x2="71.5" y2="16.23" stroke-width="6" stroke-linecap="round" />
      <line class="ray" x1="78.85" y1="34.5" x2="85.77" y2="30.5" stroke-width="6" stroke-linecap="round" />
      <line x1="4" y1="50" x2="100" y2="50" stroke="currentColor" stroke-width="5" stroke-linecap="round" />
    </svg>
  </template>

  <main>
    <header class="page">
      <div>
        <h1>Uppercase logo fonts</h1>
        <p class="intro">Every option is set as DAYMARK beside the sunrise mark, at navbar size and on the dark footer. Hover a card to lift the sun.</p>
      </div>
      <div class="controls">
        <label>Size <input id="size" type="range" min="0.8" max="2" step="0.05" value="1" /></label>
        <button id="theme" type="button">Toggle theme</button>
      </div>
    </header>

    <div class="grid" id="grid"></div>
  </main>

  <script>
    const FONTS = [
      {
        name: 'Sora', tag: 'Recommended', pick: true,
        family: "'Sora'", weight: 700, tracking: '0.08em', size: '0.98rem',
        desc: 'Geometric with open, slightly wide caps. Calm and modern, easy to read at small sizes, and it pairs well with DM Sans.',
      },
      {
        name: 'Outfit', tag: 'Clean',
        family: "'Outfit'", weight: 700, tracking: '0.1em', size: '1.02rem',
        desc: 'Rounded geometric caps with a round O. Friendly and minimal, and it echoes the round sun.',
      },
      {
        name: 'Urbanist', tag: 'Soft',
        family: "'Urbanist'", weight: 800, tracking: '0.1em', size: '1.05rem',
        desc: 'Geometric with circular bowls. Light and airy even at heavy weights.',
      },
      {
        name: 'Unbounded', tag: 'Bold',
        family: "'Unbounded'", weight: 600, tracking: '0.04em', size: '0.88rem',
        desc: 'Very wide, rounded caps. The most distinctive option, so keep it to the logo only.',
      },
      {
        name: 'Archivo Expanded', tag: 'Sturdy',
        family: "'Archivo'", weight: 700, tracking: '0.06em', size: '0.95rem', stretch: '125%',
        desc: 'Wide grotesque at 125% width. Confident and editorial without being loud.',
      },
      {
        name: 'Syne', tag: 'Character',
        family: "'Syne'", weight: 700, tracking: '0.08em', size: '1rem',
        desc: 'Wide caps with quirky details. Creative and memorable, with a bit more personality.',
      },
      {
        name: 'Lexend', tag: 'Readable',
        family: "'Lexend'", weight: 600, tracking: '0.1em', size: '0.98rem',
        desc: 'Built for readability. Even, generous spacing gives a calm, steady look.',
      },
      {
        name: 'Josefin Sans', tag: 'Vintage',
        family: "'Josefin Sans'", weight: 700, tracking: '0.14em', size: '1.05rem',
        desc: 'Elegant geometric caps with a 1920s feel. Airy and refined.',
      },
      {
        name: 'Bricolage Grotesque', tag: 'Warm',
        family: "'Bricolage Grotesque'", weight: 700, tracking: '0.06em', size: '1.02rem',
        desc: 'Grotesque with ink-trap details. Warm and friendly, still clean.',
      },
      {
        name: 'Cinzel', tag: 'Serif',
        family: "'Cinzel'", weight: 700, tracking: '0.1em', size: '1.02rem',
        desc: 'Classical Roman capitals. Timeless and calm, if you want a serif in uppercase.',
      },
      {
        name: 'DM Sans (current)', tag: 'Current',
        family: "'DM Sans'", weight: 700, tracking: '0.06em', size: '0.95rem',
        desc: 'The current logo. It is the same font as the body text, which is why it reads as generic.',
      },
    ]

    const tpl = document.getElementById('mark')
    let clipCount = 0
    function mark() {
      const svg = tpl.content.firstElementChild.cloneNode(true)
      const id = `horizon-${clipCount++}`
      svg.querySelector('clipPath').id = id
      svg.querySelector('.clip').setAttribute('clip-path', `url(#${id})`)
      svg.querySelectorAll('.ray').forEach((ray, r) => (ray.style.animationDelay = `${760 + r * 60}ms`))
      return svg
    }

    function wordmark(f) {
      const el = document.createElement('span')
      el.className = 'brand'
      Object.assign(el.style, {
        fontFamily: `${f.family}, sans-serif`,
        fontWeight: f.weight,
        letterSpacing: f.tracking,
        fontStretch: f.stretch || 'normal',
      })
      el.style.setProperty('--size', f.size)
      const text = document.createElement('span')
      text.textContent = 'Daymark'
      el.append(mark(), text)
      return el
    }

    const grid = document.getElementById('grid')
    for (const f of FONTS) {
      const card = document.createElement('article')
      card.className = `card${f.pick ? ' pick' : ''}`
      const body = document.createElement('div')
      body.className = 'body'
      body.innerHTML = `
        <div class="meta"><span class="name"></span><span class="tag"></span></div>
        <p class="desc"></p>
        <span class="spec"></span>`
      body.querySelector('.name').textContent = f.name
      body.querySelector('.tag').textContent = f.tag
      body.querySelector('.desc').textContent = f.desc
      body.querySelector('.spec').textContent =
        `${f.weight} · ${f.tracking} · ${f.size}${f.stretch ? ' · width ' + f.stretch : ''}`
      body.prepend(wordmark(f))
      const strip = document.createElement('div')
      strip.className = 'strip'
      strip.append(wordmark(f))
      card.append(body, strip)
      grid.append(card)
    }

    document.getElementById('size').addEventListener('input', (e) => {
      document.documentElement.style.setProperty('--s', e.target.value)
    })

    const root = document.documentElement
    document.getElementById('theme').addEventListener('click', () => {
      const dark =
        root.dataset.theme === 'dark' ||
        (!root.dataset.theme && matchMedia('(prefers-color-scheme: dark)').matches)
      root.dataset.theme = dark ? 'light' : 'dark'
    })
  </script>
</body>
</html>
